name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

  build:
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian-12
          - debian-13
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - fedora-44

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mkosi squashfs-tools

      - name: Build image
        run: scripts/build "${{ matrix.image }}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          dir="dist/$IMAGE"
          cp "$dir/rootfs.squashfs" "$dir/$IMAGE-amd64-rootfs.squashfs"
          cp "$dir/manifest.json" "$dir/$IMAGE-amd64-manifest.json"
          cp "$dir/SHA256SUMS" "$dir/$IMAGE-amd64-SHA256SUMS"
          gh release upload "$TAG" "$dir/$IMAGE-amd64-rootfs.squashfs" "$dir/$IMAGE-amd64-manifest.json" "$dir/$IMAGE-amd64-SHA256SUMS" --clobber
