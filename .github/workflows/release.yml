name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - name: Create release
        if: env.ACT_LOCAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes

  build:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian-12
          - debian-13
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - fedora-44

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-packer@1aa358be5cf73883762b302a3a03abd66e75b232
        with:
          version: 1.15.3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq openssh-client qemu-system-x86 qemu-utils xorriso coreutils ovmf

      - name: Build image
        run: scripts/build "${{ matrix.image }}"

      - name: Prepare release assets
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          dir="dist/$IMAGE"
          cp "$dir/root.qcow2" "$dir/$IMAGE-amd64.qcow2"
          cp "$dir/manifest.json" "$dir/$IMAGE-amd64-manifest.json"
          (cd "$dir" && sha256sum "$IMAGE-amd64.qcow2" "$IMAGE-amd64-manifest.json" > "$IMAGE-amd64-SHA256SUMS")

      - name: Upload release assets
        if: env.ACT_LOCAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          dir="dist/$IMAGE"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$dir/$IMAGE-amd64.qcow2" "$dir/$IMAGE-amd64-manifest.json" "$dir/$IMAGE-amd64-SHA256SUMS" --clobber

  build-capi:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: kubernetes-sigs/image-builder
          ref: v0.1.55
          path: image-builder

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible curl jq make qemu-system-x86 qemu-utils xorriso coreutils ovmf

      - uses: hashicorp/setup-packer@1aa358be5cf73883762b302a3a03abd66e75b232
        with:
          version: 1.15.3

      - name: Build the CAPI node image
        run: scripts/build-capi ubuntu-22.04-capi-v1.36.4 image-builder

      - name: Prepare release assets
        run: |
          dir=dist/ubuntu-22.04-capi-v1.36.4
          cp "$dir/root.qcow2" "$dir/ubuntu-22.04-amd64-capi-v1.36.4.qcow2"
          cp "$dir/manifest.json" "$dir/ubuntu-22.04-amd64-capi-v1.36.4-manifest.json"
          (cd "$dir" && sha256sum ubuntu-22.04-amd64-capi-v1.36.4.qcow2 ubuntu-22.04-amd64-capi-v1.36.4-manifest.json > ubuntu-22.04-amd64-capi-v1.36.4-SHA256SUMS)

      - name: Upload release assets
        if: env.ACT_LOCAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          dir=dist/ubuntu-22.04-capi-v1.36.4
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "$dir/ubuntu-22.04-amd64-capi-v1.36.4.qcow2" \
            "$dir/ubuntu-22.04-amd64-capi-v1.36.4-manifest.json" \
            "$dir/ubuntu-22.04-amd64-capi-v1.36.4-SHA256SUMS" \
            --clobber
