---
- name: Install FRR repository signing key
  ansible.builtin.get_url:
    url: https://deb.frrouting.org/frr/keys.gpg
    dest: /usr/share/keyrings/frrouting.gpg
    mode: '0644'

- name: Configure the pinned FRR repository
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/usr/share/keyrings/frrouting.gpg] https://deb.frrouting.org/frr jammy frr-stable
    filename: frr
    state: present

- name: Install the pinned FRR packages
  ansible.builtin.apt:
    name:
      - frr=10.7.1-0~ubuntu22.04.1
      - frr-pythontools=10.7.1-0~ubuntu22.04.1
    state: present
    update_cache: true

- name: Prevent an unreviewed FRR upgrade
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - frr
    - frr-pythontools

- name: Configure Kubernetes kernel modules
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/kubernetes.conf
    mode: '0644'

- name: Configure Kubernetes and routing sysctls
  ansible.builtin.copy:
    content: |
      net.ipv4.ip_forward=1
      net.ipv4.conf.all.proxy_arp=1
      net.ipv4.conf.default.proxy_arp=1
      net.ipv6.conf.all.forwarding=1
      net.ipv6.conf.default.forwarding=1
      net.bridge.bridge-nf-call-iptables=1
      net.bridge.bridge-nf-call-ip6tables=1
    dest: /etc/sysctl.d/90-gomi-kubernetes.conf
    mode: '0644'

- name: Verify every physical-node NIC driver is present
  ansible.builtin.command: "modinfo -n {{ item }}"
  loop:
    - igc
    - r8169
    - e1000e
  changed_when: false

- name: Verify required node binaries are present
  ansible.builtin.command: "{{ item }}"
  loop:
    - kubeadm version -o short
    - kubelet --version
    - containerd --version
    - /usr/lib/frr/bgpd --version
  changed_when: false
